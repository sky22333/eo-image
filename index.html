<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随机图片 API</title>
    <meta name="description" content="基于 EdgeOne Pages 的随机图片 API 服务" />
    <style>
        :root {
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --accent-color: #2563eb;
            --bg-color: #ffffff;
            --bg-secondary: #f3f4f6;
            --border-color: #e5e7eb;
            --code-bg: #f9fafb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f9fafb;
                --text-secondary: #9ca3af;
                --accent-color: #60a5fa;
                --bg-color: #0f172a;
                --bg-secondary: #1e293b;
                --border-color: #334155;
                --code-bg: #1e293b;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 3rem;
        }

        /* Header Section */
        header {
            text-align: left;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.05rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 0;
        }

        /* API Section */
        .api-section {
            display: grid;
            gap: 1rem;
        }

        .section-label {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .code-box {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 8px;
            font-family: "Menlo", "Monaco", "Consolas", monospace;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .code-box:hover {
            border-color: var(--accent-color);
        }

        .method {
            color: var(--accent-color);
            font-weight: 700;
            margin-right: 0.5rem;
        }

        .url {
            word-break: break-all;
            flex: 1;
        }

        /* Categories Section */
        .categories-section {
            display: grid;
            gap: 1rem;
        }

        .category-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .category-tag {
            padding: 0.5rem 1rem;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .category-tag:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-1px);
        }

        /* Footer Links */
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--accent-color);
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            body {
                padding: 1.5rem;
                justify-content: flex-start;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                gap: 2rem;
            }

            .footer-links {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>随机图片 API</h1>
            <p class="subtitle">基于 EdgeOne Pages 的高性能随机图片分发服务</p>
        </header>

        <div class="api-section">
            <div class="section-label">接口地址</div>
            <div class="code-box">
                <div>
                    <span class="method">GET</span>
                    <span class="url"><span id="base-url">https://example.com</span>/api/{分类名}</span>
                </div>
            </div>
        </div>

        <div class="categories-section">
            <div class="section-label">可用分类</div>
            <!-- 构建脚本自动生成 -->
            <div class="category-list">
                    <a href="./api/girl" class="category-tag">girl</a>
                    <a href="./api/mobi" class="category-tag">mobi</a>
                    <a href="./api/pc" class="category-tag">pc</a>
                </div>
        </div>

        <footer class="footer-links">
            <a href="./images/index.html" class="footer-link">浏览图片索引</a>
            <a href="https://edgeone.ai/zh" target="_blank" class="footer-link">由 EdgeOne 强力驱动</a>
        </footer>
    </div>

    <script>
        const origin = location.origin;
        document.getElementById("base-url").textContent = origin;
    </script>
</body>
</html>
